<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To Do App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header-section">
            <h1>My To Do App</h1>
            <button id="settingsBtn" class="settings-btn" title="Settings">⚙️</button>
        </div>
        
        <div class="add-task-section">
            <input type="text" id="taskInput" placeholder="Add a new task..." maxlength="100">
            <button id="addTaskBtn">Add Task</button>
        </div>
        
        <div class="tasks-container" id="tasksContainer">
            <!-- Tasks will be dynamically added here -->
        </div>
        
        <!-- Settings Modal -->
        <div id="settingsModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>AI Settings</h2>
                    <span class="close" id="closeSettings">&times;</span>
                </div>
                <div class="modal-body">
                    <div class="setting-group">
                        <label for="apiEndpoint">Azure AI Foundry Endpoint:</label>
                        <input type="url" id="apiEndpoint" placeholder="https://your-endpoint.azure.com/" class="setting-input">
                        <small class="help-text">Enter your Azure AI Foundry endpoint URL</small>
                    </div>
                    
                    <div class="setting-group">
                        <label for="apiKey">API Key:</label>
                        <input type="password" id="apiKey" placeholder="Enter your API key" class="setting-input">
                        <small class="help-text">Your Azure AI Foundry API key (stored securely)</small>
                    </div>

                    <div class="setting-group">
                        <label for="apiVersion">API Version:</label>
                        <input type="text" id="apiVersion" placeholder="Enter your API version" class="setting-input">
                        <small class="help-text">Your Azure AI Foundry API version (e.g., 2024-12-01-preview)</small>
                    </div>
                    
                    <div class="setting-group">
                        <label for="deploymentName">Deployment Name:</label>
                        <input type="text" id="deploymentName" placeholder="gpt-4o" class="setting-input">
                        <small class="help-text">The deployed model name (e.g., gpt-4o, gpt-35-turbo)</small>
                    </div>
                    
                    <div class="modal-actions">
                        <button id="testConnection" class="test-btn">🔍 Test Connection</button>
                        <button id="saveSettings" class="save-btn">💾 Save Settings</button>
                    </div>
                    
                    <div id="connectionStatus" class="connection-status"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
